[package]
name = "API-tester"
version = "0.1.4"
edition = "2021"

[dependencies]
eframe = { version = "0.32.3", package = "eframe" }
egui = "0.32.3"
egui_extras = "0.32.3"
egui_code_editor = "0.2"
reqwest = { version = "0.12", features = ["json", "blocking", "native-tls-vendored"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "1"
similar = "2"
jsonpath_lib = "0.3"
jmespath = "0.3"
rfd = "0.14"
url = "2"
base64 = "0.22"
csv = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["ico"] }
dirs = "5"

[build-dependencies]
winres = "0.1"

[package.metadata.bundle]
name = "API Tester"
identifier = "com.example.api-tester"
icon = ["assets/icon.icns"]
version = "0.1.0"
