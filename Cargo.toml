[package]
name = "API-tester"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.27", package = "eframe" }
egui = "0.27"
egui_extras = "0.27"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
json-patch = "1"
similar = "2"
jsonpath_lib = "0.3"
jmespath = "0.3"
rfd = "0.14"
url = "2"
base64 = "0.22"
csv = "1"
anyhow = "1"
